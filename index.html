<!doctype html>

          TradingView's tab content is a cross-origin iframe to this host.
          It's already preloaded hidden, as early as the app can start it
          (see src/pages/main/main.tsx) -- this just gets the DNS lookup +
          TLS handshake for that connection out of the way even sooner, in
          parallel with everything else, before any of our own JS has even
          downloaded. Pure network head-start; doesn't change what loads,
          when the preload mounts, or anything about how tabs work.
        -->

        <link rel="dns-prefetch" href="https://charts.deriv.com" />

    <body class="body theme theme--light">
        <!-- Google Tag Manager (noscript) -->
        <noscript
            ><iframe
                src="https://www.googletagmanager.com/ns.html?id=GTM-KV9538TF"
                height="0"
                width="0"
                style="display: none; visibility: hidden"
            ></iframe
        ></noscript>
        <!-- End Google Tag Manager (noscript) -->

        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <!--
          Static placeholder, painted before any JS downloads or runs --
          the app itself doesn't call root.render() until an async
          site-settings lookup resolves (see src/main.tsx), so without this
          the very first paint on every visit/refresh was a blank page.
          React's root.render() replaces this div's contents automatically
          once the real app mounts, so nothing here needs to be cleaned up.
        -->
        <div id="root">
            <style>
                #root__boot {
                    position: fixed;
                    inset: 0;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    gap: 14px;
                    background: #0e0e0e;
                    color: #9c9c9c;
                    font-family:
                        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                    font-size: 13px;
                }
                #root__boot-spinner {
                    width: 28px;
                    height: 28px;
                    border-radius: 50%;
                    border: 3px solid #333;
                    border-top-color: #2563eb;
                    animation: root__boot-spin 0.8s linear infinite;
                }
                @keyframes root__boot-spin {
                    to {
                        transform: rotate(360deg);
                    }
                }
            </style>
            <div id="root__boot">
                <div id="root__boot-spinner"></div>
                <div>Loading…</div>
            </div>
        </div>
