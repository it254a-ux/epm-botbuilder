sform:translateY(8px)}to{opacity:1;transform:none}}
            .epm-splash__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.epm-splash__scrim{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.35) 0%,rgba(0,0,0,.7) 100%)}.epm-splash>:not(.epm-splash__video):not(.epm-splash__scrim){position:relative;z-index:1}

            <div id="root__boot">
